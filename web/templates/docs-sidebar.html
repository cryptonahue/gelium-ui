{{define "docs-sidebar"}}
{{range $i, $g := .Groups}}
{{if $i}}<hr class="ui-divider docs-nav-divider">{{end}}
<p class="docs-nav-group-label">{{$g.Title}}</p>
<ul class="ui-list docs-nav-list">
  {{range $g.Links}}
  <li class="ui-list-item">
    <a class="ui-list-item-link{{if .Current}} is-current{{end}}" href="{{.Path}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a>
  </li>
  {{end}}
</ul>
{{end}}
{{end}}
