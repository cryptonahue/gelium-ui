{{define "pagination"}}
<nav class="ui-pagination" aria-label="{{or .Label "Pagination"}}">
  {{if .HasPrev}}<a class="ui-pagination-page" href="{{.PrevHref}}">Previous</a>{{else}}<span class="ui-pagination-page ui-pagination-page--disabled" aria-disabled="true">Previous</span>{{end}}
  {{range .PageLinks}}{{if .Current}}<span class="ui-pagination-page ui-pagination-page--current" aria-current="page">{{.Num}}</span>{{else}}<a class="ui-pagination-page" href="{{.Href}}">{{.Num}}</a>{{end}}{{end}}
  {{if .HasNext}}<a class="ui-pagination-page" href="{{.NextHref}}">Next</a>{{else}}<span class="ui-pagination-page ui-pagination-page--disabled" aria-disabled="true">Next</span>{{end}}
</nav>
{{end}}
