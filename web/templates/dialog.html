{{define "dialog"}}
{{template "button" .Trigger}}
{{end}}

{{define "dialog-confirm"}}
<div class="ui-dialog-page">
  <h2 class="ui-dialog-headline" id="confirm-dialog-title">{{.Headline}}</h2>
  <div class="ui-dialog-content"><p id="confirm-dialog-description">{{.Description}}</p></div>
  <div class="ui-dialog-actions">
    {{template "button" .Cancel}}
    <form method="post" action="/components/dialog/confirm" novalidate>
      <input type="hidden" name="action" value="confirm">
      {{template "button" .Confirm}}
    </form>
  </div>
</div>
{{end}}
