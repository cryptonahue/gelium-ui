{{/* Theme direction switcher (docs chrome). Product labels (Material, Basecoat,
     future shadcn-like presets) — never internal CSS class names. Each option is
     a real GET link to the same path with ?theme=<slug>; 0 JS. */}}
{{define "theme-switcher"}}
<nav class="ui-theme-switcher" aria-label="Visual direction">
  <span class="ui-theme-switcher-label" id="theme-switcher-label">Theme</span>
  <span class="ui-theme-switcher-options" role="list" aria-labelledby="theme-switcher-label">
    {{range .Options}}
    <a role="listitem" class="ui-theme-switcher-option{{if .Current}} is-current{{end}}" href="{{.Href}}"{{if .Current}} aria-current="true"{{end}}>{{.Label}}</a>
    {{end}}
  </span>
</nav>
{{end}}
