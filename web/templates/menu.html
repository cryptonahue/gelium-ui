          <span class="ui-menu-item-icon" aria-hidden="true"><svg class="ui-menu-item-icon-svg" viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M6,19c0,1.1 0.9,2 2,2h8c1.1,0 2-0.9 2-2V7H6v12zM19,4h-3.5l-1-1h-5l-1,1H5v2h14V4z"></path></svg></span>
          <span class="ui-menu-item-label-text">Delete</span>

      </li>
      <li class="ui-menu-divider" role="separator"></li>
      <li class="ui-menu-item ui-menu-item--select">
        <label class="ui-menu-item-label">
          <input type="checkbox" name="menu-anatomy" value="pin" checked>
          <span class="ui-menu-item-label-text">Pin to top</span>
        </label>
      </li>
    </ul>
  </section>

  <section class="menu-demo-group" aria-label="Action menu">
    <h3 class="menu-demo-heading">Actions — popover trigger</h3>
    <div class="menu-demo-anchor">
      <button type="button" class="ui-button ui-button-secondary menu-demo-trigger" popovertarget="menu-actions" popovertargetaction="toggle" aria-haspopup="menu">
        <span>Actions</span>
        <span class="menu-demo-caret" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" focusable="false"><path d="m7 10 5 5 5-5z"></path></svg></span>
      </button>
      <ul class="ui-menu" id="menu-actions" popover>
        <li class="ui-menu-item">
          <button type="button" class="ui-menu-item-button">
            <span class="ui-menu-item-icon" aria-hidden="true"><svg class="ui-menu-item-icon-svg" viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25zM20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z"></path></svg></span>

          </button>
        </li>
        <li class="ui-menu-item">
          <button type="button" class="ui-menu-item-button">
            <span class="ui-menu-item-icon" aria-hidden="true"><svg class="ui-menu-item-icon-svg" viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M18,16.08c-0.76,0 -1.44,0.3 -1.96,0.77L8.91,12.7c0.05,-0.23 0.09,-0.46 0.09,-0.7s-0.04,-0.47 -0.09,-0.7l7.05,-4.11c0.54,0.5 1.25,0.81 2.04,0.81 1.66,0 3,-1.34 3,-3s-1.34,-3 -3,-3 -3,1.34 -3,3c0,0.24 0.04,0.47 0.09,0.7L8.04,9.81C7.5,9.31 6.79,9 6,9c-1.66,0 -3,1.34 -3,3s1.34,3 3,3c0.79,0 1.5,-0.31 2.04,-0.81l7.12,4.16c-0.05,0.21 -0.08,0.43 -0.08,0.65 0,1.61 1.31,2.92 2.92,2.92 1.61,0 2.92,-1.31 2.92,-2.92s-1.31,-2.92 -2.92,-2.92z"></path></svg></span>
            <span class="ui-menu-item-label-text">Share</span>
          </button>
        </li>
        <li class="ui-menu-divider" role="separator"></li>
        <li class="ui-menu-item">
          <button type="button" class="ui-menu-item-button" disabled>
            <span class="ui-menu-item-icon" aria-hidden="true"><svg class="ui-menu-item-icon-svg" viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M6,19c0,1.1 0.9,2 2,2h8c1.1,0 2-0.9 2-2V7H6v12zM19,4h-3.5l-1-1h-5l-1,1H5v2h14V4z"></path></svg></span>
            <span class="ui-menu-item-label-text">Delete</span>
          </button>
        </li>
      </ul>
    </div>
  </section>

  <section class="menu-demo-group" aria-label="Navigation menu">
    <h3 class="menu-demo-heading">Navigation — popover trigger</h3>
    <div class="menu-demo-anchor">
      <button type="button" class="ui-button ui-button-secondary menu-demo-trigger" popovertarget="menu-nav" popovertargetaction="toggle" aria-haspopup="menu">
        <span>Navigate</span>
        <span class="menu-demo-caret" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" focusable="false"><path d="m7 10 5 5 5-5z"></path></svg></span>
      </button>
      <ul class="ui-menu" id="menu-nav" popover>
        <li class="ui-menu-item"><a class="ui-menu-item-link" href="/components/button">Buttons</a></li>
        <li class="ui-menu-item"><a class="ui-menu-item-link" href="/components/checkbox">Checkboxes</a></li>
        <li class="ui-menu-item"><a class="ui-menu-item-link" href="/components/list">List</a></li>
      </ul>
    </div>
  </section>

  <section class="menu-demo-group" aria-label="Selection menu">
    <h3 class="menu-demo-heading">Selection — popover trigger</h3>
    <div class="menu-demo-anchor">
      <button type="button" class="ui-button ui-button-secondary menu-demo-trigger" popovertarget="menu-select" popovertargetaction="toggle" aria-haspopup="menu">
        <span>Select</span>
        <span class="menu-demo-caret" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" focusable="false"><path d="m7 10 5 5 5-5z"></path></svg></span>
      </button>
      <form method="get" action="/components/menu" class="menu-demo-form">
        <ul class="ui-menu" id="menu-select" popover>
          <li class="ui-menu-item ui-menu-item--select">
            <label class="ui-menu-item-label">
              <input type="checkbox" name="menu-multi" value="bold" checked>
              <span class="ui-menu-item-label-text">Bold</span>
            </label>
          </li>
          <li class="ui-menu-item ui-menu-item--select">
            <label class="ui-menu-item-label">
              <input type="checkbox" name="menu-multi" value="italic">
              <span class="ui-menu-item-label-text">Italic</span>
            </label>
          </li>
          <li class="ui-menu-divider" role="separator"></li>
          <li class="ui-menu-item ui-menu-item--select">
            <label class="ui-menu-item-label">
              <input type="radio" name="menu-single" value="day">
              <span class="ui-menu-item-label-text">Day</span>
            </label>
          </li>
          <li class="ui-menu-item ui-menu-item--select">
            <label class="ui-menu-item-label">
              <input type="radio" name="menu-single" value="night" checked>
              <span class="ui-menu-item-label-text">Night</span>
            </label>
          </li>
          <li class="ui-menu-item">
            <button type="submit" class="ui-menu-item-button">Apply selection</button>
          </li>
        </ul>
      </form>
    </div>
  </section>

</div>
