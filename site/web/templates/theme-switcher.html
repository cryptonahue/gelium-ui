{{/* Theme direction switcher (docs chrome). Native <select> in a 0-JS GET
     form: selecting an option and submitting produces ?theme=<slug> on the
     SAME URL (no action attribute), exactly like the old ?theme= links. The
     hidden scheme input preserves the current light/dark selection, which a
     GET form would otherwise drop. JS enhancement (app.js): onchange submits
     and hides the submit button; with no JS the button still works. */}}
{{define "theme-switcher"}}
<form class="ui-theme-switcher" method="get" data-chrome-form hx-swap="none" role="group" aria-label="{{or .Label "Theme"}}">
  <svg class="ui-theme-switcher-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.1 0 2-.9 2-2 0-.53-.21-1-.55-1.34-.34-.34-.55-.81-.55-1.34 0-1.1.9-2 2-2h2.55c3.03 0 5.55-2.47 5.55-5.5C22 5.45 17.51 2 12 2z"></path></svg>
  <label class="ui-theme-switcher-label" for="theme-switcher-select">{{or .Label "Theme"}}</label>
  <select id="theme-switcher-select" name="theme" class="ui-theme-switcher-select">
    {{range .Options}}
    <option value="{{.Value}}" data-class="{{.Class}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
    {{end}}
  </select>
  <input type="hidden" name="scheme" value="{{.Scheme}}">
  <button type="submit" class="ui-theme-switcher-submit">Apply</button>
  <span class="ui-theme-switcher-selection" aria-label="Resolved visual selection" data-gelium-reference="{{or .Reference "none"}}" data-gelium-skin="{{or .Skin "none"}}">Reference: {{or .Reference "none"}} · Skin: {{or .Skin "none"}}</span>
</form>
{{end}}
