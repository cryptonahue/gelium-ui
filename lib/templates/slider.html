{{define "slider-demo"}}
<div class="slider-demo-grid">
  <div class="slider-demo-item">
    <div class="ui-slider" data-ui-slider style="--ui-slider-fill: 0%">
      <input type="range" id="slider-unselected" min="0" max="100" value="0">
      <label class="slider-demo-caption" for="slider-unselected">Unselected</label>
    </div>
  </div>
  <div class="slider-demo-item">
    <div class="ui-slider" data-ui-slider style="--ui-slider-fill: 65%">
      <input type="range" id="slider-populated" min="0" max="100" value="65">
      <label class="slider-demo-caption" for="slider-populated">Populated</label>
    </div>
  </div>
  <div class="slider-demo-item">
    <div class="ui-slider" data-ui-slider style="--ui-slider-fill: 40%">
      <input type="range" id="slider-disabled" min="0" max="100" value="40" disabled>
      <label class="slider-demo-caption" for="slider-disabled">Disabled</label>
    </div>
  </div>
  <div class="slider-demo-item">
    <div class="ui-slider ui-slider--ticks" data-ui-slider style="--ui-slider-fill: 40%">
      <input type="range" id="slider-ticks" min="0" max="10" step="1" value="4">
      <label class="slider-demo-caption" for="slider-ticks">Ticks</label>
    </div>
  </div>
  <div class="slider-demo-item">
    <div class="ui-slider ui-slider--value-label" data-ui-slider data-value="65" style="--ui-slider-fill: 65%">
      <input type="range" id="slider-value-label" min="0" max="100" value="65">
      <label class="slider-demo-caption" for="slider-value-label">Value label</label>
    </div>
  </div>
</div>
{{end}}
