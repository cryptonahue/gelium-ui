{{define "progress-demo"}}
<div class="progress-demo-grid">
  <div class="progress-demo-item">
    <div class="ui-progress">
      <progress id="progress-30" max="100" value="30"></progress>
      <label class="progress-demo-caption" for="progress-30">30%</label>
    </div>
  </div>
  <div class="progress-demo-item">
    <div class="ui-progress">
      <progress id="progress-65" max="100" value="65"></progress>
      <label class="progress-demo-caption" for="progress-65">65%</label>
    </div>
  </div>
  <div class="progress-demo-item">
    <div class="ui-progress">
      <progress id="progress-100" max="100" value="100"></progress>
      <label class="progress-demo-caption" for="progress-100">100%</label>
    </div>
  </div>
  <div class="progress-demo-item">
    <div class="ui-progress">
      <progress id="progress-indeterminate"></progress>
      <label class="progress-demo-caption" for="progress-indeterminate">Indeterminate</label>
    </div>
  </div>
  <div class="progress-demo-item">
    <div class="ui-progress ui-progress--circular" role="status" aria-labelledby="progress-circular-caption">
      <span class="ui-progress-circle" aria-hidden="true"></span>
    </div>
    <!-- The circular ring names itself from this visible caption (G6): the
         wrapper's accessible name is the linked caption, never a shadowing
         aria-label. -->
    <p class="progress-demo-caption" id="progress-circular-caption">Circular indeterminate</p>
  </div>
</div>
{{end}}
